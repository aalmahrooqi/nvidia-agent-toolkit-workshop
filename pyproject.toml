[project]
name = "claw-training-distilled"
version = "0.1.0"
description = "Distilled NemoClaw/OpenShell training for NVIDIA Solution Architects"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Data and validation
    "pydantic>=2.13,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "packaging>=26.0",
    # Notebook environment
    "ipykernel>=7.3.0,<8",
    "jupyterlab>=4.6.1,<5",
    "ipywidgets>=8.1.8,<9",
    # Display and formatting
    "colorama>=0.4.6,<1",
    "ansi2html>=1.9,<2",
    # Notebook validation and execution
    "nbformat>=5.9",
    "nbclient>=0.11",
    # Workshop site (web/): server, in-page terminal, Markdown lessons
    "tornado>=6.5",
    "terminado>=0.18",
    "mistune>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.21",
    "pre-commit>=4.6",
    "pytest>=9.1.1,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Notebook cells legitimately violate E501 (long string literals, %%writefile
# content, URLs in markdown-adjacent code) and E402 (post-%%writefile imports
# that depend on a file the cell just created).
#
# shared/utils with verbatim error messages and scripts with long docstring
# URLs are documented exceptions.
[tool.ruff.lint.per-file-ignores]
"tracks/**/*.ipynb" = ["E501", "E402", "F401"]
"shared/utils/platform.py" = ["E501"]
"scripts/check_notebooks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
