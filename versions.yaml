# Source-backed version contract for NemoClaw/OpenShell training.
#
# `managed_stack` is the compatibility unit used by course sandboxes.
# `standalone_observations` records newer upstream releases for comparison only;
# those values must never override a NemoClaw-managed sandbox component.
# Existing automation continues to read runtime.*, cli_tools.*, and python.*.

metadata:
  verified_date: "2026-11-20"
  managed_policy: "Install and validate the NemoClaw LKG as one compatibility unit; never mix in newer standalone agent or OpenShell releases."
  standalone_policy: "Informational upstream observations only, except host-optional Ollama; never install these versions into a NemoClaw-managed sandbox."

managed_stack:
  nemoclaw:
    version: "0.0.145"
    release_ref: "v0.0.145"
    source_url: "https://github.com/NVIDIA/NemoClaw/tree/v0.0.145"
    verified_date: "2026-11-20"
    notes: "Upstream's own lkg and latest tags point at this release. Course compatibility root."
  openshell:
    version: "0.0.116"
    release_ref: "v0.0.116"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/nemoclaw-blueprint/blueprint.yaml"
    verified_date: "2026-11-20"
    notes: "NemoClaw v0.0.145 requires this exact OpenShell version."
  openclaw:
    version: "2026.10.5"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/openclaw/manifest.yaml"
    verified_date: "2026-11-20"
    notes: "Pinned by the managed OpenClaw manifest and shipped in the release's managed image; rebuild instead of updating in place."
  hermes:
    version: "0.21.3"
    release_ref: "v2026.9.14"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/hermes/manifest.yaml"
    verified_date: "2026-11-20"
    notes: "The managed CLI reports semver 0.21.3; the corresponding upstream release tag is calendar-versioned."
  langchain_deepagents_code:
    version: "0.1.87"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/langchain-deepagents-code/manifest.yaml"
    verified_date: "2026-11-20"
    notes: "Hash-locked terminal agent exposed through the nemo-deepagents alias."
  pi:
    version: "0.84.1"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/pi/manifest.yaml"
    verified_date: "2026-11-20"
    notes: "Manifest pin only. Upstream documents Pi as a release candidate; an ordinary install rejects --agent pi."

managed_inference_profiles:
  dgx_spark:
    runtime_image: "nvcr.io/nvidia/vllm@sha256:9204569b17ee4c0eff75194b8e6e458479c8aee18953b5ab9cf359fcdac659e2"
    default_model: "nvidia/Qwen3.6-35B-A3B-NVFP4"
    provider: "vllm-local"
    course_coverage: "not-implemented"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/managed-inference/recipes/vllm.qwen3-6-35b-a3b-nvfp4.spark-single.v1.yaml"
    verified_date: "2026-11-20"
    notes: "Read from the v0.0.145 managed-inference catalog, which pins images by digest. This distilled course teaches hosted inference only and has no DGX Spark branch."
  dgx_station:
    runtime_image: "vllm/vllm-openai@sha256:fd33bec1578f312a01547cc6b9691a5154c3e8bcfb76d2b35acb657bfc4eee8f"
    default_model: "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4"
    provider: "vllm-local"
    course_coverage: "not-implemented"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/docs/inference/set-up-vllm.mdx"
    verified_date: "2026-11-20"
    notes: "Default changed from DeepSeek V4 Flash since v0.0.79; upstream marks this preset experimental. Not represented by a course platform branch."
  linux_nvidia_gpu:
    runtime_image: "nvcr.io/nvidia/vllm@sha256:7be6c2f676c36059a494fe17254e69ae5c677535ba6191044e5fc8e42a91c773"
    default_model: "nvidia/NVIDIA-Nemotron-3-Nano-4B-FP8"
    provider: "vllm-local"
    course_coverage: "not-implemented"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/docs/inference/set-up-vllm.mdx"
    verified_date: "2026-11-20"
    notes: "The digest is the linux-amd64 recipe's; the linux-arm64 recipe pins sha256:447995cbb57e6c7cf792cab95e9852e5f62b5fb6d2f39e030fa4eda9a54eadb4. No course branch."

standalone_observations:
  openshell:
    version: "0.1.9"
    release_ref: "v0.1.9"
    source_url: "https://github.com/NVIDIA/OpenShell/releases/tag/v0.1.9"
    verified_date: "2026-11-20"
    notes: "Standalone latest; incompatible with the NemoClaw v0.0.145 exact 0.0.116 gate."
  openclaw:
    version: "2026.11.6"
    source_url: "https://www.npmjs.com/package/openclaw/v/2026.11.6"
    verified_date: "2026-11-20"
    notes: "Stable npm release; beta dist-tags are intentionally ignored."
  hermes:
    version: "0.23.3"
    release_ref: "v0.23.3"
    source_url: "https://github.com/NousResearch/hermes-agent/releases/tag/v0.23.3"
    verified_date: "2026-11-20"
    notes: "Standalone latest. Upstream release tags are now semver; the managed pin still corresponds to a calendar tag."
  deepagents_code:
    version: "0.2.12"
    source_url: "https://pypi.org/project/deepagents-code/0.2.12/"
    verified_date: "2026-11-20"
    notes: "Standalone Deep Agents Code release; managed sandboxes remain on 0.1.87."
  deepagents_python:
    version: "0.7.41"
    source_url: "https://pypi.org/project/deepagents/0.7.41/"
    verified_date: "2026-11-20"
    notes: "Standalone Python SDK package."
  deepagents_javascript:
    version: "1.17.0"
    source_url: "https://www.npmjs.com/package/deepagents/v/1.17.0"
    verified_date: "2026-11-20"
    notes: "Standalone JavaScript SDK package."
  pi:
    version: "1.6.0"
    source_url: "https://www.npmjs.com/package/@earendil-works/pi-coding-agent/v/1.6.0"
    verified_date: "2026-11-20"
    notes: "Standalone Pi coding agent; NemoClaw v0.0.145's manifest pins 0.84.1."
  ollama:
    version: "0.40.16"
    release_ref: "v0.40.16"
    source_url: "https://github.com/ollama/ollama/releases/tag/v0.40.16"
    verified_date: "2026-11-20"
    notes: "Host-optional local provider; do not install it inside a managed sandbox."

runtime:
  docker:
    pinned: "28.0"
    min: null
    source_url: "https://docs.nvidia.com/nemoclaw/latest/user-guide/openclaw/get-started/prerequisites"
    verified_date: "2026-07-10"
    notes: "Course reference environment uses Docker 28.x. Upstream requires a tested Docker Engine, Docker Desktop, or Colima path but publishes no numeric minimum, so validation checks availability instead of inventing a version floor."
  node:
    pinned: "24.18.0"
    min: "22.19"
    source_url: "https://nodejs.org/en/blog/release/v24.18.0"
    verified_date: "2026-11-20"
    notes: "Authoring pin, enforced through .nvmrc. NemoClaw v0.0.145 requires Node.js 22.19 or later (22.16 at v0.0.79)."
  python:
    pinned: "3.13"
    min: "3.12"
    source_url: "https://pypi.org/project/nvidia-nat/1.8.0/"
    verified_date: "2026-07-10"
    notes: "Notebook runtime. Keep requires-python <3.14 because nvidia-nat 1.8.0 requires Python below 3.14."

cli_tools:
  nemoclaw:
    source: "installer-env"
    compatibility_scope: "nemoclaw-managed"
    source_url: "https://github.com/NVIDIA/NemoClaw/tree/v0.0.145"
    verified_date: "2026-11-20"
    install_tag: "v0.0.145"
    expected_version: "0.0.145"
    env_var: "NEMOCLAW_INSTALL_TAG"
    install_url: "https://www.nvidia.com/nemoclaw.sh"
    notes: "Course pin. All managed component pins below come from this release."
  openshell:
    source: "bundled-with-nemoclaw"
    compatibility_scope: "nemoclaw-managed"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/nemoclaw-blueprint/blueprint.yaml"
    verified_date: "2026-11-20"
    expected_version_range:
      min: "0.0.116"
      max: "0.0.116"
    notes: "Exact managed compatibility gate. Standalone 0.1.9 is informational only."
  openclaw:
    source: "bundled-with-nemoclaw"
    compatibility_scope: "nemoclaw-managed"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/openclaw/manifest.yaml"
    verified_date: "2026-11-20"
    expected_version: "2026.10.5"
    notes: "Managed runtime shipped in the release's sandbox image. Validate read-only; use NemoClaw rebuild/re-onboard on mismatch and never npm-upgrade it in place."
  hermes:
    source: "bundled-with-nemoclaw"
    compatibility_scope: "nemoclaw-managed"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/hermes/manifest.yaml"
    verified_date: "2026-11-20"
    expected_version: "0.21.3"
    notes: "Managed manifest semver corresponding to upstream release tag v2026.9.14."
  deepagents_code:
    source: "bundled-with-nemoclaw"
    compatibility_scope: "nemoclaw-managed"
    source_url: "https://github.com/NVIDIA/NemoClaw/blob/v0.0.145/agents/langchain-deepagents-code/manifest.yaml"
    verified_date: "2026-11-20"
    expected_version: "0.1.87"
    notes: "Hash-locked LangChain Deep Agents Code runtime exposed through nemo-deepagents."
  deepagents_npm:
    source: "npm"
    compatibility_scope: "standalone-observation"
    source_url: "https://www.npmjs.com/package/deepagents/v/1.17.0"
    verified_date: "2026-11-20"
    expected_version: "1.17.0"
    notes: "Standalone JavaScript SDK metadata only; not installed by course automation."
  deepagents_python:
    source: "pypi"
    compatibility_scope: "standalone-observation"
    source_url: "https://pypi.org/project/deepagents/0.7.41/"
    verified_date: "2026-11-20"
    expected_version: "0.7.41"
    notes: "Standalone Python SDK metadata only; not installed by course automation."
  pi:
    source: "npm"
    compatibility_scope: "standalone-observation"
    source_url: "https://www.npmjs.com/package/@earendil-works/pi-coding-agent/v/1.6.0"
    verified_date: "2026-11-20"
    expected_version: "1.6.0"
    notes: "Standalone Pi metadata only; current package scope is @earendil-works."
  ollama:
    source: "installer-env"
    compatibility_scope: "host-optional"
    source_url: "https://github.com/ollama/ollama/releases/tag/v0.40.16"
    verified_date: "2026-11-20"
    install_version: "0.40.16"
    expected_version: "0.40.16"
    env_var: "OLLAMA_VERSION"
    install_url: "https://ollama.com/install.sh"
    notes: "Optional host-side local provider for compatibility labs; never install inside the managed sandbox."

